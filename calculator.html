<!DOCTYPE html>
<head>
<title>Calculator</title>
<link rel="stylesheet" href="style.CSS">
<style>
       body { font-family: Arial; display: flex;
        justify-content: center;
         padding-top: 50px; background: #f0f0f0; }
        .Calculator { background: white;
             padding: 40px;
              border-radius: 10px;
               box-shadow: 0 0 15px rgba(0,0,0,0.2);
                text-align: center; }
        input {
            display: block; padding: 10px; margin: 15px auto; width: 220px;
         }
        button {
             padding: 10px 15px; margin: 5px; width: 50px; font-size: 20px; cursor: pointer; }
</style>
</head>
<body>
    <div class="Calculator">
    <h1>Calculator</h1>
    <input type="number" id="num1" placeholder="Enter first number">
    <br><br>
    <input type="number" id="num2" placeholder="Enter second number">
    <br><br>
    <button onclick="add()">+</button>
    <button onclick="sub()">-</button>
    <button onclick="mul()">*</button>
    <button onclick="div()">/</button>
    <h1 id="result">Result:</h1>
</div>
    </body>
    <script>
        function add(){
        let number1 = Number (document.querySelector("#num1").value);
        let number2 = Number(document.querySelector("#num2").value);
            let sum = number1 + number2;
            document.querySelector("#result").innerHTML ="Result:" + sum;   
        }
        function sub(){
               let number1 = Number (document.querySelector("#num1").value);
        let number2 = Number(document.querySelector("#num2").value);
            let sum = number1 - number2;
            document.querySelector("#result").innerHTML ="Result:" +sum;   

        }
        function mul(){
            let number1 = Number (document.querySelector("#num1").value);
        let number2 = Number(document.querySelector("#num2").value);
            let sum = number1 * number2;
            document.querySelector("#result").innerHTML ="Result:" + sum;    
        }
        function div(){
                let number1 = Number (document.querySelector("#num1").value);
        let number2 = Number(document.querySelector("#num2").value);
            let sum = number1 / number2;
            document.querySelector("#result").innerHTML ="Result:" + sum;    
        }
    </script>       
</body>
</html>
